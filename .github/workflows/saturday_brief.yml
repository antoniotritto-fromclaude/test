name: Saturday Brief

on:
  schedule:
    # Ogni sabato alle 06:00 UTC = 07:00 CET (08:00 CEST in estate)
    - cron: '0 6 * * 6'
  # Trigger manuale per test e prime esecuzioni
  workflow_dispatch:

jobs:
  briefing:
    name: Genera spunti settimanali
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: saturday_brief/requirements.txt

      - name: Installa dipendenze
        run: pip install -r saturday_brief/requirements.txt

      - name: Diagnosi Notion API
        run: |
          python3 -c "
import urllib.request, os, sys
db_id = os.environ.get('NOTION_DATABASE_ID','')
token = os.environ.get('NOTION_API_KEY','')
print(f'DB_ID: {db_id[:8]}...{db_id[-4:]}')
print(f'TOKEN: {token[:12]}...{token[-4:]}')
req = urllib.request.Request(
    f'https://api.notion.com/v1/databases/{db_id}',
    headers={'Authorization': f'Bearer {token}', 'Notion-Version': '2022-06-28'}
)
try:
    with urllib.request.urlopen(req) as r:
        import json
        data = json.loads(r.read())
        print(f'Notion OK — title: {list(data.get(\"title\",[{}])[0].get(\"text\",{}).values())}')
except urllib.error.HTTPError as e:
    print(f'Notion HTTP {e.code}: {e.read().decode()}')
except Exception as e:
    print(f'Notion ERROR: {e}')
"
        env:
          NOTION_API_KEY:     ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Esegui Saturday Brief
        working-directory: saturday_brief
        run: python main.py 2>&1 | tee ../run.log; exit ${PIPESTATUS[0]}
        env:
          NOTION_API_KEY:     ${{ secrets.NOTION_API_KEY }}
          CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Carica log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-brief-log
          path: run.log
          retention-days: 7
