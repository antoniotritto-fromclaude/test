name: Saturday Brief

on:
  schedule:
    - cron: '0 7 * * 6'   # 07:00 UTC = 08:00 CET (inverno) / 09:00 CEST (estate)
  workflow_dispatch:

jobs:
  briefing:
    name: Genera spunti settimanali
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install --no-cache-dir -r saturday_brief/requirements.txt

      - name: Diagnosi e avvio Saturday Brief
        working-directory: saturday_brief
        run: |
          LOG_FILE="../run.log"
          {
            echo "=== NOTION API CHECK ==="
            echo "DB_ID=${NOTION_DATABASE_ID:0:8}...${NOTION_DATABASE_ID: -4}"
            HTTP=$(curl -s -o /tmp/notion.json -w "%{http_code}" \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H "Notion-Version: 2022-06-28" \
              "https://api.notion.com/v1/databases/$NOTION_DATABASE_ID")
            echo "HTTP Status: $HTTP"
            python3 -m json.tool /tmp/notion.json 2>/dev/null | head -20 || cat /tmp/notion.json
            echo ""
            echo "=== MAIN SCRIPT ==="
          } 2>&1 | tee "$LOG_FILE"

          python main.py 2>&1 | tee -a "$LOG_FILE"
          SCRIPT_EXIT=${PIPESTATUS[0]}

          # Write to Step Summary so it's accessible via API
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$LOG_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $SCRIPT_EXIT
        env:
          NOTION_API_KEY:       ${{ secrets.NOTION_API_KEY }}
          CLAUDE_API_KEY:       ${{ secrets.CLAUDE_API_KEY }}
          NOTION_DATABASE_ID:   ${{ secrets.NOTION_DATABASE_ID }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER:         antoniotritto@gmail.com
          GMAIL_RECIPIENT:      antoniotritto@gmail.com

      - name: Carica log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-brief-log
          path: run.log
          retention-days: 7

      - name: Posta log come commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 saturday_brief/post_log_comment.py
