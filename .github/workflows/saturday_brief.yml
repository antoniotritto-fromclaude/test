name: Saturday Brief

on:
  schedule:
    # Ogni sabato alle 06:00 UTC = 07:00 CET (08:00 CEST in estate)
    - cron: '0 6 * * 6'
  # Trigger manuale per test e prime esecuzioni
  workflow_dispatch:

jobs:
  briefing:
    name: Genera spunti settimanali
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: saturday_brief/requirements.txt

      - name: Installa dipendenze
        run: pip install -r saturday_brief/requirements.txt

      - name: Diagnosi e avvio Saturday Brief
        working-directory: saturday_brief
        run: |
          LOG_FILE="../run.log"
          {
            echo "=== NOTION API CHECK ==="
            echo "DB_ID=${NOTION_DATABASE_ID:0:8}...${NOTION_DATABASE_ID: -4}"
            HTTP=$(curl -s -o /tmp/notion.json -w "%{http_code}" \
              -H "Authorization: Bearer $NOTION_API_KEY" \
              -H "Notion-Version: 2022-06-28" \
              "https://api.notion.com/v1/databases/$NOTION_DATABASE_ID")
            echo "HTTP Status: $HTTP"
            python3 -m json.tool /tmp/notion.json 2>/dev/null | head -20 || cat /tmp/notion.json
            echo ""
            echo "=== MAIN SCRIPT ==="
          } 2>&1 | tee "$LOG_FILE"

          python main.py 2>&1 | tee -a "$LOG_FILE"
          SCRIPT_EXIT=${PIPESTATUS[0]}

          # Write to Step Summary so it's accessible via API
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$LOG_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $SCRIPT_EXIT
        env:
          NOTION_API_KEY:     ${{ secrets.NOTION_API_KEY }}
          CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Carica log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-brief-log
          path: run.log
          retention-days: 7

      - name: Posta log come commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(cat run.log 2>/dev/null || echo "run.log non trovato")
          python3 -c "
import urllib.request, json, os
token = os.environ['GH_TOKEN']
sha   = os.environ['GITHUB_SHA']
repo  = os.environ['GITHUB_REPOSITORY']
log   = open('run.log').read() if __import__('os').path.exists('run.log') else 'run.log non trovato'
body  = '\`\`\`\n' + log[:65000] + '\n\`\`\`'
data  = json.dumps({'body': body}).encode()
req   = urllib.request.Request(
    f'https://api.github.com/repos/{repo}/commits/{sha}/comments',
    data=data, method='POST',
    headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json',
             'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
)
with urllib.request.urlopen(req) as r:
    print('Comment posted:', r.status)
"
